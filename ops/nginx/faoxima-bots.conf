# Install once in the TLS server for kanamir.faoximabot.xyz.
# New real bot_N directories need no generated nginx file and no nginx reload.
location ^~ /faoxima/. {
    return 404;
}

location ~* ^/faoxima/(bot_[1-9][0-9]{0,8})/(?:\..*|.*/\..*) {
    return 404;
}

location ~* ^/faoxima/(bot_[1-9][0-9]{0,8})/.*\.(?:env|ya?ml|sql|log|sh|json|bak|lock|md|conf|ini|zip|tmp|err|swp|orig)$ {
    return 404;
}

# Private/runtime paths: storage holds API credentials/cache, logs are private,
# cron/cronbot are CLI jobs, and the remaining directories contain internal code.
location ~ ^/faoxima/(bot_[1-9][0-9]{0,8})/(?:storage|logs|cron|cronbot|installer|provisioning|tests|ops|bin|lib|re|api/(?:lib|handlers)|panel/lib)(?:/|$) {
    return 404;
}

location ~* ^/faoxima/(bot_[1-9][0-9]{0,8})/(?:config|table)\.php$ {
    return 404;
}

location ~ ^/faoxima/(bot_[1-9][0-9]{0,8})/(.*\.php)$ {
    root /var/www;
    try_files /faoxima/$1/$2 =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/faoxima/$1/$2;
    fastcgi_param SCRIPT_NAME /faoxima/$1/$2;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_connect_timeout 5s;
    fastcgi_read_timeout 60s;
    fastcgi_send_timeout 30s;
}

location ~* ^/faoxima/(bot_[1-9][0-9]{0,8})/.*\.(?:php[0-9]?|phtml|phar|pht)$ {
    return 404;
}

location ~ ^/faoxima/(bot_[1-9][0-9]{0,8})/(.*)$ {
    root /var/www;
    try_files /faoxima/$1/$2 /faoxima/$1/$2/ =404;
}

location ~ ^/faoxima/(bot_[1-9][0-9]{0,8})/?$ {
    return 308 /faoxima/$1/index.php;
}
