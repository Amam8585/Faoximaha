# Included inside the TLS server for kanamir.faoximabot.xyz.
# The strict bot_N expression is the only tenant-controlled path component.
location ~* ^/(bot_[1-9][0-9]{0,8})/(?:\..*|.*/\..*) {
    return 404;
}

location ~* ^/(bot_[1-9][0-9]{0,8})/.*\.(?:env|ya?ml|sql|log|sh|json|bak|lock|md|conf|ini|zip|tmp|err|swp|orig)$ {
    return 404;
}

location ~ ^/(bot_[1-9][0-9]{0,8})/(?:storage|logs|cron|installer|api/lib|api/handlers|panel/lib)(?:/|$) {
    return 404;
}

location ~ ^/(bot_[1-9][0-9]{0,8})/(?:config|table)\.php$ {
    return 404;
}

location ~ ^/(bot_[1-9][0-9]{0,8})/(.*\.php)$ {
    set $faoxima_bot $1;
    set $faoxima_script $2;
    root /var/www/faoxima;
    try_files /$faoxima_bot/$faoxima_script =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/$faoxima_bot/$faoxima_script;
    fastcgi_param SCRIPT_NAME /$faoxima_bot/$faoxima_script;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass unix:/run/php/php8.3-fpm-$faoxima_bot.sock;
    fastcgi_connect_timeout 5s;
    fastcgi_read_timeout 60s;
    fastcgi_send_timeout 30s;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
}

location ~* ^/(bot_[1-9][0-9]{0,8})/.*\.(?:php[0-9]?|phtml|phar|pht)$ {
    return 404;
}

location ~ ^/(bot_[1-9][0-9]{0,8})/(.*)$ {
    root /var/www/faoxima;
    try_files /$1/$2 /$1/$2/ =404;
}

location ~ ^/(bot_[1-9][0-9]{0,8})/?$ {
    return 308 /$1/index.php;
}
