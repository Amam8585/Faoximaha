; Each installed bot gets one generated pool in the shared php8.3-fpm master.
; This example makes the effective worker identity explicit.
[bot_3]
user = fx_bot_3
group = fx_bot_3
listen = /run/php/php8.3-fpm-bot_3.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 20s
pm.max_requests = 500
chdir = /var/www/faoxima/bot_3
clear_env = yes
security.limit_extensions = .php
php_admin_value[open_basedir] = /var/www/faoxima:/tmp
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/www/faoxima/bot_3/logs/php-fpm.log
php_admin_value[opcache.validate_timestamps] = 1
php_admin_value[opcache.revalidate_freq] = 0
